# Site Settings
title: CAC Ontology
description: Crimes Against Children Ontology - A comprehensive semantic framework for modeling child exploitation investigations
baseurl: ""
url: "https://site.cacontology.projectvic.org"
email: ""
twitter_username: ""
github_username: "Project-VIC-International"
github_repo: "CAC-Ontology"

# Build Settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE
  - .gitignore

# Navigation
navigation:
  - title: Getting Started
    url: /getting-started
  - title: Releases
    url: /releases
  - title: Ontology
    url: /ontology
  - title: Examples
    url: /examples
  - title: Developers
    url: /developers
  - title: Community
    url: /community
  - title: Resources
    url: /resources
  - title: Contact
    url: /contact

# Theme settings
theme: minima

# Custom variables
cac_ontology:
  version: "3.1.0"
  case_uco_version: "1.5.0"
  gufo_version: "1.0.0"
  namespace: "https://cacontology.projectvic.org"
  spine_namespace: "https://cacontology.projectvic.org/core#"
  extends: ["CASE", "UCO", "gUFO"]
  modules: 35
  domain_areas: 6
  ontology_count: 97
  classes: 2209
  properties: 2527
  examples: 61
  sparql_suites: 32
  sdk_url: "https://github.com/vulnmaster/CASE-UCO-SDK"
  presentation_url: "https://www.figma.com/deck/sP6RILkazvPti5xx3DVqnl"

