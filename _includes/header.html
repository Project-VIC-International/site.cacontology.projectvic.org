<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} - Home">
      {% if site.logo %}
        <img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" class="site-logo">
      {% else %}
        CAC Ontology
      {% endif %}
    </a>

    <nav class="site-nav" id="site-navigation" role="navigation" aria-label="Main navigation">
      <input type="checkbox" id="nav-trigger" class="nav-trigger"
             aria-label="Toggle navigation menu"
             aria-expanded="false"
             aria-controls="site-nav-menu" />
      <label for="nav-trigger" aria-label="Toggle navigation menu" aria-hidden="true">
        <span class="hamburger-lines">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </span>
        <span class="sr-only">Menu</span>
      </label>

      <div class="trigger" id="site-nav-menu">
        {%- for item in site.navigation -%}
          <a class="page-link" href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {%- endfor -%}
      </div>
    </nav>

    <a href="https://secure.givelively.org/donate/project-vic-international-inc/crimes-against-children-cac-ontology"
       class="btn-donate"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Donate to CAC Ontology initiative">
      Donate $
    </a>
  </div>
</header>
