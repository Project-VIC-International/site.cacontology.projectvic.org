<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {%- seo -%}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {%- feed_meta -%}
    <meta name="msvalidate.01" content="9D2874A5D676EC43B0EC7B3AD91AF39A" />
  </head>

  <body>
    <a href="#main-content" class="skip-to-content">Skip to main content</a>
    {%- include header.html -%}

    <main id="main-content" class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}
    
    <script>
      (function() {
        var nav = document.getElementById('site-navigation');
        var trigger = document.getElementById('nav-trigger');
        var menu = document.getElementById('site-nav-menu');
        if (!trigger || !menu) return;

        function closeMenu() {
          trigger.checked = false;
          syncAria();
        }

        function syncAria() {
          var open = trigger.checked;
          trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
        }

        trigger.addEventListener('change', syncAria);
        syncAria();

        document.addEventListener('click', function(e) {
          if (!trigger.checked) return;
          if (nav && !nav.contains(e.target)) closeMenu();
        });

        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && trigger.checked) closeMenu();
        });

        menu.querySelectorAll('.page-link').forEach(function(link) {
          link.addEventListener('click', closeMenu);
        });
      })();
    </script>
    <script src="{{ '/assets/js/consent.js' | relative_url }}" defer></script>
  </body>
</html>
